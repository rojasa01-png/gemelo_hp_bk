<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemelo digital HP (LiveKit)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    main { max-width: 760px; margin: 0 auto; }
    #stage { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 2; display: flex; }
    #stage video { width: 100%; height: 100%; object-fit: cover; }
    .row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    input { flex: 1; min-width: 220px; padding: 8px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; }
    button { padding: 8px 16px; border-radius: 8px; border: 0; background: #3b82f6; color: white; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #estado { color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Gemelo digital HP</h1>
  <div class="row">
    <input id="api" placeholder="URL de token_server (ej. http://localhost:8001)" value="http://localhost:8001">
    <button id="conectar">Hablar con el gemelo</button>
    <button id="colgar" disabled>Colgar</button>
  </div>
  <div id="stage"></div>
  <p id="estado">Desconectado.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.0/dist/livekit-client.umd.min.js"></script>
<script>
  const { Room, RoomEvent, Track } = LivekitClient;
  const $ = (id) => document.getElementById(id);
  let room = null;

  const estado = (t) => { $("estado").textContent = t; };

  // La URL del backend también puede venir en la dirección: ?api=https://...
  const apiParam = new URLSearchParams(location.search).get("api");
  if (apiParam) $("api").value = apiParam;

  $("conectar").onclick = async () => {
    $("conectar").disabled = true;
    estado("Pidiendo token...");
    try {
      const base = $("api").value.replace(/\/$/, "");
      const r = await fetch(base + "/livekit-token", { method: "POST" });
      if (!r.ok) throw new Error("token_server respondió " + r.status);
      const { url, token } = await r.json();

      room = new Room({ adaptiveStream: true, dynacast: true });

      // Video y audio del avatar (los publica Anam en la sala).
      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === Track.Kind.Video) {
          const el = track.attach();
          el.playsInline = true;
          $("stage").replaceChildren(el);
        } else if (track.kind === Track.Kind.Audio) {
          document.body.appendChild(track.attach());
        }
      });
      room.on(RoomEvent.Disconnected, () => {
        estado("Desconectado.");
        $("stage").replaceChildren();
        $("conectar").disabled = false;
        $("colgar").disabled = true;
      });

      estado("Conectando...");
      await room.connect(url, token);
      await room.startAudio();                       // permite reproducir audio
      await room.localParticipant.setMicrophoneEnabled(true);  // pide permiso de micrófono
      $("colgar").disabled = false;
      estado("Conectado. Espera a que aparezca la cara y habla.");
    } catch (e) {
      console.error(e);
      estado("Error: " + e.message);
      $("conectar").disabled = false;
    }
  };

  $("colgar").onclick = () => room && room.disconnect();
</script>
</body>
</html>
